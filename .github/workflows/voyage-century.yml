name: Voyage Century

on:
  push:
    paths:
      - "voyage-century/**"
      - ".github/workflows/voyage-century.yml"
  pull_request:
    paths:
      - "voyage-century/**"
      - ".github/workflows/voyage-century.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: voyage-century

jobs:
  data:
    name: Reconstruction Database und Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank der Befunde prüfen
        run: python3 tools/validate_reconstruction_db.py
      - name: Generierte Dateien sind aktuell
        run: python3 tools/export_content.py --check

  backend:
    name: Datenbank und Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VC_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Migrationen und Schutzregeln (psql)
        run: tools/test_schema.sh
      - name: Backend bauen und testen
        run: tools/test_backend.sh
