<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>24/7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: transparent;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif; color: #e9ecf1; user-select: none;
        }
        .hidden { display: none !important; }

        #shop {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(8, 9, 12, .5); backdrop-filter: blur(3px);
        }
        .panel {
            width: 520px; background: rgba(14, 16, 20, .95);
            border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 22px 26px;
        }
        header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
        h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; color: #e0a642; }
        .money { font-size: 14px; color: #7fd18a; }

        .list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }
        .row {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            background: rgba(24,27,33,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
        }
        .row .info { flex: 1; }
        .row .label { font-size: 14px; }
        .row .desc { font-size: 11px; color: #8b93a1; margin-top: 2px; }
        .row .price { font-size: 13px; color: #e0a642; min-width: 70px; text-align: right; }
        .row input {
            width: 56px; padding: 6px; text-align: center; border-radius: 8px;
            border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.35); color: #e9ecf1;
        }
        button {
            padding: 8px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.08);
            background: #e0a642; color: #1a1408; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #edb457; }
        button.ghost { background: transparent; color: #e9ecf1; font-weight: 400; }
        button.ghost:hover { background: rgba(255,255,255,.08); }
        footer { display: flex; justify-content: flex-end; margin-top: 18px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }
    </style>
</head>
<body>
<div id="shop" class="hidden">
    <div class="panel">
        <header>
            <h1>24/7 Laden</h1>
            <span class="money">Bargeld: <span id="money">0</span> $</span>
        </header>
        <div class="list" id="list"></div>
        <footer><button class="ghost" id="btn-close">Schliessen (ESC)</button></footer>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
