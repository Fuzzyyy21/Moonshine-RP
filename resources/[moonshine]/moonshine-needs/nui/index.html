<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Moonshine Beduerfnis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Balken ------------------------------------------------------------------>
<div id="widget" class="hidden">
    <div class="head">
        <span class="icon" id="icon">🩸</span>
        <div class="text">
            <div class="label" id="label">Blutdurst</div>
            <div class="band" id="band">gesättigt</div>
        </div>
        <span class="value" id="value">100</span>
    </div>

    <div class="track"><div class="fill" id="fill"></div></div>

    <div class="zone hidden" id="zone">
        <span id="zone-icon">🌲</span>
        <span id="zone-label">Nationalpark</span>
    </div>
</div>

<!-- Fortschritt beim Trinken, Reissen, Ziehen ------------------------------->
<div id="progress" class="hidden">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<script src="app.js"></script>
</body>
</html>
